version: "3.8"

services:
  app:
    image: conduit:latest
    ports:
      - "3000:3000"
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - NEXT_PUBLIC_POWERSYNC_URL=${NEXT_PUBLIC_POWERSYNC_URL}
      - NEXT_PUBLIC_POWERSYNC_TOKEN=${NEXT_PUBLIC_POWERSYNC_TOKEN}
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=postgres
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_DATABASE=${PG_DATABASE}
      - NFCE_WEBHOOK_API_KEY=${NFCE_WEBHOOK_API_KEY}
      - NEXT_PUBLIC_NFCE_API_URL=${NEXT_PUBLIC_NFCE_API_URL}
      - NEXT_PUBLIC_PROJECT_URL=${NEXT_PUBLIC_PROJECT_URL}
